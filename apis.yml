name: River Financial
description: >-
  River Financial Inc. (river.com) is a regulated U.S.-based Bitcoin brokerage
  and bank for long-term investors, operating under NMLS ID #1906809. Customers
  can buy, sell, send, and receive bitcoin, get paid in bitcoin via direct
  deposit, and earn interest on cash balances paid in bitcoin. River holds 100%
  of customer bitcoin in full-reserve multisig cold storage, publishes monthly
  third-party Proof of Reserves attestations, and provides FDIC insurance on cash
  up to $250,000 through partner bank Lead Bank. River exposes a GraphQL data API
  at https://river.com/api secured by an OAuth 2.0 authorization-code + PKCE flow
  with OpenID Connect discovery (balances, transactions, identity, and payment
  network read scopes). Surfaced as a polychain portfolio company and enriched
  from River's public well-known, OIDC, and security surfaces.
